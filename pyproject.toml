[project]
name = "geo-proximity-lead-magnet"
version = "1.0.0"
description = "A lightweight, serverless web application for finding the 5 nearest construction/real-estate points of interest in Da Nang, Vietnam."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "httpx==0.27.0",
    "Jinja2==3.1.4",
    "python-dotenv==1.0.1",
    "setuptools",
    "redis==5.0.0",
    "structlog==24.4.0",
    "upstash-redis>=0.16.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "psycopg[binary]==3.3.2",
    "SQLAlchemy==2.0.36",
    "geoalchemy2>=0.16.0",
    "asyncpg==0.29.0",
    "email-validator>=2.0.0",
    "itsdangerous>=2.2.0",
    "resend>=2.4.0",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
