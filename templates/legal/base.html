<!doctype html>
<html lang="{{ lang|default('en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Legal - DillDrill{% endblock %}</title>
  <link rel="icon" type="image/png" href="/dd_icon.png">
  <link rel="apple-touch-icon" href="/dd_icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/legal.css">
  {# Child templates override this block to set the active nav item. #}
  {# Possible values: hub | terms | privacy | research | access         #}
  {% block active_page %}hub{% endblock %}
  {% set activep = self.active_page() %}
</head>
<body class="legal-page">
  <div class="legal-header">
    <a href="/" class="legal-back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to App
    </a>
    <nav class="legal-subnav" aria-label="Legal documents">
      <a href="/legal"           {% if activep == 'hub'      %}aria-current="page"{% endif %}>Hub</a>
      <a href="/terms"           {% if activep == 'terms'    %}aria-current="page"{% endif %}>Terms</a>
      <a href="/privacy"         {% if activep == 'privacy'  %}aria-current="page"{% endif %}>Privacy</a>
      <a href="/research-notice" {% if activep == 'research' %}aria-current="page"{% endif %}>Research</a>
      <a href="/research-access" {% if activep == 'access'   %}aria-current="page"{% endif %}>Access</a>
    </nav>
  </div>
  <main class="legal-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
